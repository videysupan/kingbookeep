<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website GitHub Saya</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      padding: 30px;
      max-width: 500px;
    }
    h1 {
      color: #58a6ff;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      background: #238636;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Website GitHub Saya</h1>
    <p>Selamat datang di website baru saya.</p>
    <p>Website ini menggunakan GitHub Pages gratis.</p>
    <a href="https://github.com/">Kunjungi GitHub</a>
  </div>
</body>
</html>
